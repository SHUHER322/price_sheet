# Автоматическая проверка на GitHub при каждом push в main и в каждом PR
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # Скачать код репозитория на виртуальную машину GitHub
      - uses: actions/checkout@v5

      # Та же версия Python, что и локально
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      # Тесты работают на сохранённых страницах: ни интернет, ни Chrome, ни Google не нужны
      - name: Запустить тесты
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Проверяем, что образ собирается: Python, Chrome и виртуальный экран ставятся без ошибок
      - name: Собрать Docker-образ
        run: docker build -t price_sheet .

      # Внутри образа есть Chrome и xvfb-run
      - name: Проверить содержимое образа
        run: docker run --rm price_sheet sh -c "google-chrome --version && which xvfb-run && python -c 'import app.watch'"
